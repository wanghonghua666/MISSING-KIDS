<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missing Kids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header -->
    <header id="header">
        <a href="https://www.instagram.com/missingkids_lab/" target="_blank" rel="noopener noreferrer">
            <img class="logo" src="logo.png" alt="Logo">
        </a>
    </header>

    <!-- Contact Modal (kept for future use) -->
    <div class="modal-overlay" id="contact-modal">
        <div class="modal">
            <button class="close" id="close-contact" aria-label="Close">×</button>
            <h2>Email</h2>
            <div class="form-group">
                <input type="email" id="contact-email" placeholder="your@email.com" required>
            </div>
            <button id="send-email" class="cta-button" type="button">Send</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="https://www.instagram.com/missingkids_lab/" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
        <p>&copy; 2025 MissingKids. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
